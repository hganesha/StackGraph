name: API lane

on:
  pull_request:
  push:
    branches: [main]

jobs:
  synthetic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make pilot-100
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-100
          path: artifacts/pilot/pilot-100-repositories.json

  contracts-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stackgraph-foundation/package-lock.json
      - run: npm ci
        working-directory: stackgraph-foundation
      - run: npm run validate
        working-directory: stackgraph-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/shared/src/contracts/openapi.generated.ts
      - run: bash -n scripts/start_docker.sh && ./scripts/start_docker.sh --help > /dev/null
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm lint:css
      - run: pnpm perf:budget

  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: docker compose up --wait -d database
      - run: docker compose run --rm migrate
      - run: docker compose run --rm seed
      - run: docker compose run --rm projection
      - run: docker compose up --wait -d api
      - run: pnpm e2e
        env:
          E2E_DATA_SOURCE: live
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - if: always()
        run: docker compose down -v

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api seed ai-prompts mcp-server
      - name: Verify FastAPI and canonical OpenAPI are identical
        run: |
          mkdir -p "$RUNNER_TEMP/stackgraph-openapi"
          docker compose run --rm --no-deps \
            -v "$RUNNER_TEMP/stackgraph-openapi:/export" \
            api python scripts/export_openapi.py /export/openapi.json
          diff -u stackgraph-foundation/contracts/v1/openapi.json \
            "$RUNNER_TEMP/stackgraph-openapi/openapi.json"
      - run: docker compose run --rm --no-deps api python -m pytest -q
      - run: docker compose run --rm --no-deps seed python -m unittest discover -s tests -v
      - run: docker compose run --rm --no-deps --entrypoint python ai-prompts -m unittest discover -s /code/tests -v
      - run: docker build -t stackgraph-enterprise-discovery-test -f services/enterprise-discovery/Dockerfile.test .
      - run: docker run --rm stackgraph-enterprise-discovery-test
      - run: docker build -t stackgraph-mcp-test -f services/mcp-server/Dockerfile.test .
      - run: docker run --rm stackgraph-mcp-test

  golden-corpus:
    # §9.1 states correctness as a score against a labelled corpus. Without this job the
    # objective is a sentence in a document; with it, a false positive fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --requirement services/enterprise-discovery/requirements.txt
      - name: Scanner precision and recall
        run: python3 scripts/golden_corpus_report.py --output "$RUNNER_TEMP/golden-corpus.json"
      - name: Scanner latency, memory, and throughput
        run: python3 scripts/benchmark_scanner.py --iterations 5 --output "$RUNNER_TEMP/scanner-benchmark.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-baseline
          path: |
            ${{ runner.temp }}/golden-corpus.json
            ${{ runner.temp }}/scanner-benchmark.json

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --wait -d database
      - run: docker compose run --rm migrate
      - run: docker compose run --rm seed
      - run: docker compose run --rm projection
      - name: API integration under RLS
        run: >-
          docker compose run --rm
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_app:stackgraph_app@database:5432/stackgraph
          -e STACKGRAPH_TEST_ADMIN_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          api python -m pytest -q
      - name: Data integration
        run: >-
          docker compose run --rm
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          seed python -m unittest discover -s tests -v
      - name: Intelligence integration
        run: >-
          docker compose run --rm
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          --entrypoint python ai-prompts -m unittest discover -s /code/tests -v
      - run: docker build -t stackgraph-enterprise-discovery-test -f services/enterprise-discovery/Dockerfile.test .
      - name: Enterprise discovery integration
        run: >-
          docker run --rm --network stackgraph_default
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          stackgraph-enterprise-discovery-test
      - if: always()
        run: docker compose down -v
