name: API lane

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stackgraph-foundation/package-lock.json
      - run: npm ci
        working-directory: stackgraph-foundation
      - run: npm run validate
        working-directory: stackgraph-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stackgraph/shared typecheck
      - run: pnpm --filter @stackgraph/web typecheck

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api seed ai-prompts
      - run: docker compose run --rm --no-deps api python -m pytest -q
      - run: docker compose run --rm --no-deps seed python -m unittest discover -s tests -v
      - run: docker compose run --rm --no-deps --entrypoint python ai-prompts -m unittest discover -s /code/tests -v
      - run: PYTHONPATH=services/enterprise-discovery python3 -m unittest discover -s services/enterprise-discovery/tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d database
      - run: docker compose run --rm migrate
      - run: docker compose run --rm seed
      - run: docker compose run --rm projection
      - name: API integration under RLS
        run: >-
          docker compose run --rm
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_app:stackgraph_app@database:5432/stackgraph
          -e STACKGRAPH_TEST_ADMIN_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          api python -m pytest -q
      - name: Data integration
        run: >-
          docker compose run --rm
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          seed python -m unittest discover -s tests -v
      - name: Intelligence integration
        run: >-
          docker compose run --rm
          -e STACKGRAPH_TEST_DATABASE_URL=postgresql://stackgraph_admin:stackgraph_admin@database:5432/stackgraph
          --entrypoint python ai-prompts -m unittest discover -s /code/tests -v
      - if: always()
        run: docker compose down -v
