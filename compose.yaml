name: stackgraph

services:
  database:
    image: apache/age:release_PG16_1.6.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STACKGRAPH_DB_NAME:-stackgraph}
      POSTGRES_USER: ${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}
      POSTGRES_PASSWORD: ${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}
      STACKGRAPH_DB_APP_USER: ${STACKGRAPH_DB_APP_USER:-stackgraph_app}
      STACKGRAPH_DB_APP_PASSWORD: ${STACKGRAPH_DB_APP_PASSWORD:-stackgraph_app}
    ports:
      - "127.0.0.1:${STACKGRAPH_DB_PORT:-5432}:5432"
    volumes:
      - stackgraph_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init/005-create-app-role.sh:/docker-entrypoint-initdb.d/005-create-app-role.sh:ro
      - ./stackgraph-foundation/schema.sql:/docker-entrypoint-initdb.d/010-schema.sql:ro
      - ./infrastructure/database/init/020-create-graph.sql:/docker-entrypoint-initdb.d/020-create-graph.sql:ro
      - ./infrastructure/database/init/030-grant-app-role.sh:/docker-entrypoint-initdb.d/030-grant-app-role.sh:ro
      - ./infrastructure/database/tests:/stackgraph/tests:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      STACKGRAPH_ENVIRONMENT: development
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_APP_USER:-stackgraph_app}:${STACKGRAPH_DB_APP_PASSWORD:-stackgraph_app}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_DB_POOL_MIN_SIZE: ${STACKGRAPH_DB_POOL_MIN_SIZE:-1}
      STACKGRAPH_DB_POOL_MAX_SIZE: ${STACKGRAPH_DB_POOL_MAX_SIZE:-5}
      STACKGRAPH_GRAPH_READ_MODE: ${STACKGRAPH_GRAPH_READ_MODE:-auto}
      STACKGRAPH_GRAPH_AGE_TIMEOUT_SECONDS: ${STACKGRAPH_GRAPH_AGE_TIMEOUT_SECONDS:-3}
      STACKGRAPH_CORS_ALLOWED_ORIGINS: ${STACKGRAPH_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:3100,http://localhost:5173}
      STACKGRAPH_AUTH_MODE: ${STACKGRAPH_AUTH_MODE:-development}
      STACKGRAPH_AUTH_SESSION_SECRET: ${STACKGRAPH_AUTH_SESSION_SECRET:-}
      STACKGRAPH_DEFAULT_TENANT_ID: ${STACKGRAPH_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      STACKGRAPH_DEVELOPMENT_ACTOR_KEY: ${STACKGRAPH_DEVELOPMENT_ACTOR_KEY:-local-user}
      STACKGRAPH_CONTRACTS_DIR: /contracts/v1
      STACKGRAPH_AI_ASK_ENABLED: ${STACKGRAPH_AI_ASK_ENABLED:-false}
      STACKGRAPH_AI_ASK_ROUTE: ${STACKGRAPH_AI_ASK_ROUTE:-default}
      STACKGRAPH_AI_ASK_FALLBACK_ENABLED: ${STACKGRAPH_AI_ASK_FALLBACK_ENABLED:-true}
      STACKGRAPH_AI_ASK_MAX_EVIDENCE_CHARS: ${STACKGRAPH_AI_ASK_MAX_EVIDENCE_CHARS:-50000}
      STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY: ${STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY:-stackgraph-local-development-credential-key}
      STACKGRAPH_AI_PROMPTS_DIR: /code/prompts
      STACKGRAPH_AI_ROUTES_JSON: ${STACKGRAPH_AI_ROUTES_JSON:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-StackGraph}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      STACKGRAPH_GITHUB_APP_SETUP_ENABLED: ${STACKGRAPH_GITHUB_APP_SETUP_ENABLED:-false}
      STACKGRAPH_GITHUB_APP_SLUG: ${STACKGRAPH_GITHUB_APP_SLUG:-}
      STACKGRAPH_GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      STACKGRAPH_GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      STACKGRAPH_GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      STACKGRAPH_GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      STACKGRAPH_GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
      STACKGRAPH_GITHUB_APP_SETUP_CALLBACK_URI: ${STACKGRAPH_GITHUB_APP_SETUP_CALLBACK_URI:-}
      STACKGRAPH_GITHUB_APP_WEB_RETURN_URI: ${STACKGRAPH_GITHUB_APP_WEB_RETURN_URI:-/admin}
      STACKGRAPH_GITHUB_MANUAL_BINDING_ENABLED: ${STACKGRAPH_GITHUB_MANUAL_BINDING_ENABLED:-true}
      STACKGRAPH_GITHUB_API_URL: ${STACKGRAPH_GITHUB_API_URL:-https://api.github.com}
      STACKGRAPH_GITHUB_ALLOW_INSECURE_LOCALHOST: ${STACKGRAPH_GITHUB_ALLOW_INSECURE_LOCALHOST:-false}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "127.0.0.1:${STACKGRAPH_API_PORT:-8080}:8000"
    volumes:
      - ./apps/api/app:/code/app:ro
      - ./apps/api/tests:/code/tests:ro
      - ./services/intelligence/ai-services/stackgraph_ai:/code/stackgraph_ai:ro
      - ./services/intelligence/ai-services/prompts:/code/prompts:ro
      - ./stackgraph-foundation/contracts/v1:/contracts/v1:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_DATA_SOURCE: live
        NEXT_PUBLIC_API_BASE_URL: ${STACKGRAPH_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_AUTH_REQUIRED: ${STACKGRAPH_WEB_AUTH_REQUIRED:-false}
    restart: unless-stopped
    environment:
      STACKGRAPH_WEB_AUTH_REQUIRED: ${STACKGRAPH_WEB_AUTH_REQUIRED:-false}
    ports:
      - "127.0.0.1:${STACKGRAPH_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  seed:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_SEED_DIR: /seed
    volumes:
      - ./stackgraph-foundation/seed:/seed:ro
    depends_on:
      database:
        condition: service_healthy

  migrate:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_MIGRATIONS_DIR: /migrations
    command: ["python", "-m", "stackgraph_data.migrate"]
    volumes:
      - ./infrastructure/database/migrations:/migrations:ro
    depends_on:
      database:
        condition: service_healthy

  projection:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_GRAPH_NAME: stackgraph
      STACKGRAPH_PROJECTION_BATCH_SIZE: ${STACKGRAPH_PROJECTION_BATCH_SIZE:-100}
      STACKGRAPH_DB_APP_USER: ${STACKGRAPH_DB_APP_USER:-stackgraph_app}
    command: ["python", "-m", "stackgraph_data.project"]
    depends_on:
      database:
        condition: service_healthy

  depsdev:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    entrypoint: ["python", "-m", "stackgraph_data.depsdev_worker"]
    command: ["work"]
    depends_on:
      database:
        condition: service_healthy

  depsdev-continuous:
    profiles: [pipeline]
    build:
      context: ./services/data-platform
    restart: unless-stopped
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    entrypoint: ["python", "-m", "stackgraph_data.depsdev_worker"]
    command: ["serve", "--poll-seconds", "${STACKGRAPH_PIPELINE_POLL_SECONDS:-2}"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; psycopg.connect(os.environ['STACKGRAPH_DATABASE_URL']).execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  osv-continuous:
    profiles: [pipeline]
    build:
      context: ./services/data-platform
    restart: unless-stopped
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    entrypoint: ["python", "-m", "stackgraph_data.osv_worker"]
    command: ["serve", "--poll-seconds", "${STACKGRAPH_PIPELINE_POLL_SECONDS:-2}"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; psycopg.connect(os.environ['STACKGRAPH_DATABASE_URL']).execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  npm-registry:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_NPM_REGISTRY_TOKEN: ${STACKGRAPH_NPM_REGISTRY_TOKEN:-}
    entrypoint: ["python", "-m", "stackgraph_data.npm_registry_cli"]
    command: ["--help"]

  oss-catalog:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    entrypoint: ["python", "-m", "stackgraph_data.huggingface_npm_catalog"]
    depends_on:
      database:
        condition: service_healthy

  osv:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    entrypoint: ["python", "-m", "stackgraph_data.osv_worker"]
    command: ["work"]
    depends_on:
      database:
        condition: service_healthy

  repository-scanner:
    profiles: [tools]
    build:
      context: ./services/enterprise-discovery
    entrypoint: ["python", "-m", "stackgraph_discovery.repository_scanner"]
    command: ["--help"]
    volumes:
      - ./services/enterprise-discovery/repository-snapshots:/snapshots

  repository-acquirer:
    profiles: [tools]
    build:
      context: ./services/enterprise-discovery
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      STACKGRAPH_EVIDENCE_STORE_ROOT: /evidence
      STACKGRAPH_EVIDENCE_S3_BUCKET: ${STACKGRAPH_EVIDENCE_S3_BUCKET:-}
      STACKGRAPH_EVIDENCE_S3_PREFIX: ${STACKGRAPH_EVIDENCE_S3_PREFIX:-stackgraph-evidence}
      STACKGRAPH_EVIDENCE_S3_KMS_KEY_ID: ${STACKGRAPH_EVIDENCE_S3_KMS_KEY_ID:-}
      STACKGRAPH_EVIDENCE_S3_ENDPOINT: ${STACKGRAPH_EVIDENCE_S3_ENDPOINT:-}
      STACKGRAPH_EVIDENCE_RETENTION_DAYS: ${STACKGRAPH_EVIDENCE_RETENTION_DAYS:-30}
      STACKGRAPH_EVIDENCE_LEGAL_HOLD: ${STACKGRAPH_EVIDENCE_LEGAL_HOLD:-false}
    entrypoint: ["python", "-m", "stackgraph_discovery.github_snapshot"]
    command: ["--help"]
    volumes:
      - ./services/enterprise-discovery/repository-snapshots:/snapshots
      - stackgraph_evidence_data:/evidence

  github-lifecycle:
    profiles: [tools]
    build:
      context: ./services/enterprise-discovery
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      GITHUB_INSTALLATION_TOKEN: ${GITHUB_INSTALLATION_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
    entrypoint: ["python", "-m", "stackgraph_discovery.github_installation_cli"]
    command: ["--help"]
    depends_on:
      database:
        condition: service_healthy

  github-webhook:
    profiles: [github, pipeline]
    build:
      context: ./services/enterprise-discovery
    restart: unless-stopped
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_EVIDENCE_STORE_ROOT: /evidence
      STACKGRAPH_EVIDENCE_S3_BUCKET: ${STACKGRAPH_EVIDENCE_S3_BUCKET:-}
      STACKGRAPH_EVIDENCE_S3_PREFIX: ${STACKGRAPH_EVIDENCE_S3_PREFIX:-stackgraph-evidence}
      STACKGRAPH_EVIDENCE_S3_KMS_KEY_ID: ${STACKGRAPH_EVIDENCE_S3_KMS_KEY_ID:-}
      STACKGRAPH_EVIDENCE_S3_ENDPOINT: ${STACKGRAPH_EVIDENCE_S3_ENDPOINT:-}
      STACKGRAPH_EVIDENCE_RETENTION_DAYS: ${STACKGRAPH_EVIDENCE_RETENTION_DAYS:-30}
      STACKGRAPH_EVIDENCE_LEGAL_HOLD: ${STACKGRAPH_EVIDENCE_LEGAL_HOLD:-false}
      STACKGRAPH_GITHUB_WEBHOOK_PORT: 8090
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-stackgraph-local-development-webhook-secret}
    entrypoint: ["python", "-m", "stackgraph_discovery.github_webhook_server"]
    ports:
      - "127.0.0.1:${STACKGRAPH_GITHUB_WEBHOOK_PORT:-8090}:8090"
    volumes:
      - stackgraph_evidence_data:/evidence
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  github-control-loop:
    profiles: [pipeline]
    build:
      context: .
      dockerfile: services/enterprise-discovery/Dockerfile.control-loop
    restart: unless-stopped
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_EVIDENCE_STORE_ROOT: /evidence
      STACKGRAPH_EVIDENCE_S3_BUCKET: ${STACKGRAPH_EVIDENCE_S3_BUCKET:-}
      STACKGRAPH_EVIDENCE_S3_PREFIX: ${STACKGRAPH_EVIDENCE_S3_PREFIX:-stackgraph-evidence}
      STACKGRAPH_EVIDENCE_S3_KMS_KEY_ID: ${STACKGRAPH_EVIDENCE_S3_KMS_KEY_ID:-}
      STACKGRAPH_EVIDENCE_S3_ENDPOINT: ${STACKGRAPH_EVIDENCE_S3_ENDPOINT:-}
      STACKGRAPH_EVIDENCE_RETENTION_DAYS: ${STACKGRAPH_EVIDENCE_RETENTION_DAYS:-30}
      STACKGRAPH_EVIDENCE_LEGAL_HOLD: ${STACKGRAPH_EVIDENCE_LEGAL_HOLD:-false}
      STACKGRAPH_GITHUB_API_URL: ${STACKGRAPH_GITHUB_API_URL:-https://api.github.com}
      STACKGRAPH_GITHUB_ALLOW_INSECURE_LOCALHOST: ${STACKGRAPH_GITHUB_ALLOW_INSECURE_LOCALHOST:-false}
      GITHUB_INSTALLATION_TOKEN: ${GITHUB_INSTALLATION_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
    command:
      - serve
      - --snapshot-root
      - /snapshots
      - --evidence-root
      - /evidence
      - --poll-seconds
      - ${STACKGRAPH_PIPELINE_POLL_SECONDS:-2}
    volumes:
      - stackgraph_repository_snapshots:/snapshots
      - stackgraph_evidence_data:/evidence
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; psycopg.connect(os.environ['STACKGRAPH_DATABASE_URL']).execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  projection-continuous:
    profiles: [pipeline]
    build:
      context: ./services/data-platform
    restart: unless-stopped
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_GRAPH_NAME: stackgraph
      STACKGRAPH_PROJECTION_BATCH_SIZE: ${STACKGRAPH_PROJECTION_BATCH_SIZE:-100}
      STACKGRAPH_DB_APP_USER: ${STACKGRAPH_DB_APP_USER:-stackgraph_app}
    command: ["python", "-m", "stackgraph_data.project", "--poll-seconds", "${STACKGRAPH_PIPELINE_POLL_SECONDS:-2}"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; psycopg.connect(os.environ['STACKGRAPH_DATABASE_URL']).execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  intelligence-continuous:
    profiles: [pipeline]
    build:
      context: ./services/intelligence/ai-services
    restart: unless-stopped
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY: ${STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY:-stackgraph-local-development-credential-key}
      STACKGRAPH_AI_ROUTES_JSON: ${STACKGRAPH_AI_ROUTES_JSON:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    entrypoint: ["python", "-m", "stackgraph_ai.modernization_worker"]
    command: ["serve", "--ai-unmapped", "--max-jobs", "${STACKGRAPH_INTELLIGENCE_BATCH_SIZE:-10}", "--poll-seconds", "${STACKGRAPH_PIPELINE_POLL_SECONDS:-2}"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; psycopg.connect(os.environ['STACKGRAPH_DATABASE_URL']).execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  scanner-ingest:
    profiles: [tools]
    build:
      context: ./services/data-platform
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    entrypoint: ["python", "-m", "stackgraph_data.scanner_ingest"]
    command: ["--help"]
    volumes:
      - ./services/enterprise-discovery/repository-snapshots:/snapshots
    depends_on:
      database:
        condition: service_healthy

  ai-prompts:
    profiles: [tools]
    build:
      context: ./services/intelligence/ai-services
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
    command: ["--prompts-dir", "/code/prompts"]
    depends_on:
      database:
        condition: service_healthy

  capability-intelligence:
    profiles: [tools]
    build:
      context: ./services/intelligence/ai-services
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY: ${STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY:-stackgraph-local-development-credential-key}
      STACKGRAPH_AI_ROUTES_JSON: ${STACKGRAPH_AI_ROUTES_JSON:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    entrypoint: ["python", "-m", "stackgraph_ai.capability_worker"]
    command: ["--help"]
    depends_on:
      database:
        condition: service_healthy

  modernization-intelligence:
    profiles: [tools]
    build:
      context: ./services/intelligence/ai-services
    environment:
      STACKGRAPH_DATABASE_URL: postgresql://${STACKGRAPH_DB_ADMIN_USER:-stackgraph_admin}:${STACKGRAPH_DB_ADMIN_PASSWORD:-stackgraph_admin}@database:5432/${STACKGRAPH_DB_NAME:-stackgraph}
      STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY: ${STACKGRAPH_CREDENTIAL_ENCRYPTION_KEY:-stackgraph-local-development-credential-key}
      STACKGRAPH_AI_ROUTES_JSON: ${STACKGRAPH_AI_ROUTES_JSON:-}
